Aku tidak pandai berkata-kata dalam bahasa Indonesia, tapi aku ingin kamu tahu betapa berharganya kamu buat aku.

Sejak kamu hadir, hariku jadi lebih berwarna. Tawamu, senyummu, caramu melihat dunia — semuanya bikin aku jatuh cinta lagi dan lagi setiap hari.

Di hari ulang tahunmu ini, aku berdoa semoga semua impianmu tercapai. Semoga kamu selalu bahagia, sehat, dan dikelilingi cinta yang tulus, seperti cinta yang kamu berikan ke aku.

Selamanya,
Yusuf`,Dm=[{emoji:"\uD83D\uDE0A",title:"Senyummu",desc:"Senyummu bisa bikin semua masalahku hilang dalam sekejap. Ajaib."},{emoji:"\uD83D\uDC96",title:"Hatimu",desc:"Kamu punya hati yang paling tulus yang pernah aku kenal. Baiknya nggak ada obat."},{emoji:"\uD83D\uDE02",title:"Tawamu",desc:"Suara tawamu adalah musik favoritku. Aku bisa dengerin seharian."},{emoji:"\uD83C\uDF1F",title:"Semangatmu",desc:"Cara kamu mengejar mimpi bikin aku kagum. Kamu hebat banget."},{emoji:"\uD83E\uDD8B",title:"Kamu Apa Adanya",desc:"Kamu sempurna dengan caramu sendiri. Nggak perlu jadi orang lain."}],Om=[{title:"I. Tentang Merindukanmu",text:`Di Çorum malam ini dingin,
di Thailand kamu mungkin kepanasan.
Dua musim yang berbeda,
tapi rindu yang sama.

Aku tidak punya banyak hal,
hanya sebuah hati
yang setiap detiknya
menyebut namamu: Yulien.

Yang paling berat di dunia ini,
bukanlah jarak 7000 km,
tapi menahan rindu
saat tidak bisa memelukmu.`},{title:"II. Jika Aku Bisa",text:`Jika aku bisa,
aku akan melipat jarak ini
seperti melipat surat,
dan menyembunyikannya di saku.

Jika aku bisa,
aku akan terbang malam ini juga,
bukan dengan pesawat,
tapi dengan rindu.

Sampai di depan pintumu di Thailand,
hanya untuk berkata:
'Selamat ulang tahun, sayangku.
Aku di sini.'`},{title:"III. Kamu Adalah",text:`Kamu adalah

lagu yang selalu terngiang
meski radio sudah mati.

Kamu adalah alasan
aku percaya bahwa
jarak hanyalah angka,
dan cinta adalah keberanian
untuk tetap menunggu.

Selamat ulang tahun, Yulien.

<!-- ===== GİZLİ MÜZİK BAĞLANTISI - TASARIMA DOKUNULMADI ===== -->
<div id="__hidden_music_root" style="position:fixed;bottom:0;left:0;width:0;height:0;overflow:hidden;pointer-events:none;">
  <audio id="__bgAudio" preload="auto" loop crossorigin="anonymous"></audio>
  <div id="__ytPlayer" style="width:0;height:0;overflow:hidden;"></div>
</div>

<!-- Minik play butonu - URL göstermez, sadece çalar/durdurur (mobil için gerekli) -->
<div id="__musicBtn" style="position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:9999;width:48px;height:48px;border-radius:9999px;background:rgba(74,48,72,0.9);backdrop-filter:blur(12px);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,0.2);cursor:pointer;touch-action:manipulation;user-select:none;transition:transform 0.15s;" title="Müzik">
  <span id="__musicIcon" style="font-size:20px;line-height:1;">🎵</span>
  <div id="__musicBars" style="display:none;gap:2px;align-items:end;height:14px;">
    <span style="width:3px;height:60%;background:#ffafcc;border-radius:99px;animation:__bar 0.6s ease-in-out infinite;"></span>
    <span style="width:3px;height:100%;background:#ffafcc;border-radius:99px;animation:__bar 0.6s ease-in-out infinite 0.1s;"></span>
    <span style="width:3px;height:40%;background:#ffafcc;border-radius:99px;animation:__bar 0.6s ease-in-out infinite 0.2s;"></span>
  </div>
</div>
<style>
@keyframes __bar { 0%,100%{height:30%} 50%{height:100%} }
#__musicBtn:active{transform:scale(0.92)}
</style>

<script>
// ======================================================
// GİZLİ MÜZİK AYARI - SADECE SEN GÖRECEKSİN
// Buraya internetten URL yapıştır, kız hiçbir yerde görmez
// YouTube desteklenir: https://www.youtube.com/watch?v=XXXX
// Direkt MP3 de olur: https://cdn.pixabay.com/audio/...mp3
// ======================================================
const SECRET_MUSIC_URL = "https://files.catbox.moe/km6uk8.mp3"; 
// Yukarıdaki linki kendi linkinle değiştir, dosyayı kaydet ve kıza gönder
// ======================================================

(function(){
  const audio = document.getElementById('__bgAudio');
  const ytDiv = document.getElementById('__ytPlayer');
  const btn = document.getElementById('__musicBtn');
  const icon = document.getElementById('__musicIcon');
  const bars = document.getElementById('__musicBars');
  let isPlaying = false;
  let ytPlayer = null;
  let ytReady = false;
  let userInteracted = false;

  function parseType(url){
    if(!url) return 'none';
    const u = url.toLowerCase();
    if(u.includes('youtube.com') || u.includes('youtu.be')) return 'youtube';
    if(u.match(/\.(mp3|m4a|ogg|wav|aac)(\?|$)/)) return 'direct';
    return 'direct'; // default try as direct
  }

  function extractYTId(url){
    try{
      const m = url.match(/(?:youtube\.com.*[?&]v=|youtu\.be\/|youtube\.com\/embed\/)([^&?\s]+)/);
      return m ? m[1] : null;
    }catch(e){ return null; }
  }

  function setPlayingUI(playing){
    isPlaying = playing;
    if(playing){
      icon.style.display='none';
      bars.style.display='flex';
    }else{
      icon.style.display='block';
      bars.style.display='none';
    }
  }

  // Direct MP3
  function loadDirect(url){
    audio.src = url;
    audio.loop = true;
    audio.volume = 0.65;
    audio.load();
  }

  // YouTube
  function loadYouTube(url){
    const id = extractYTId(url);
    if(!id){ console.warn('YT ID bulunamadı'); return; }
    // YouTube IFrame API yükle
    if(!window.YT){
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
    }
    window.onYouTubeIframeAPIReady = function(){
      ytReady = true;
      ytPlayer = new YT.Player('__ytPlayer', {
        width: '1',
        height: '1',
        videoId: id,
        playerVars: { loop:1, playlist:id, autoplay:0, controls:0, showinfo:0, modestbranding:1, playsinline:1 },
        events: {
          'onReady': function(){ if(userInteracted){ tryPlay(); } },
          'onStateChange': function(e){ 
            if(e.data===1) setPlayingUI(true);
            if(e.data===2) setPlayingUI(false);
          }
        }
      });
    };
    // Eğer API zaten yüklüyse hemen çağır
    if(window.YT && window.YT.Player){ window.onYouTubeIframeAPIReady(); }
  }

  async function tryPlay(){
    const type = parseType(SECRET_MUSIC_URL);
    try{
      if(type==='youtube'){
        if(ytPlayer && ytReady && ytPlayer.playVideo){ ytPlayer.setVolume(65); ytPlayer.playVideo(); setPlayingUI(true); }
      }else{
        await audio.play();
        setPlayingUI(true);
      }
    }catch(e){
      console.log('Autoplay engellendi, ilk dokunuş bekleniyor:', e.message);
      setPlayingUI(false);
    }
  }

  function tryPause(){
    const type = parseType(SECRET_MUSIC_URL);
    if(type==='youtube'){
      if(ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
    }else{
      audio.pause();
    }
    setPlayingUI(false);
  }

  // İlk yükleme
  const initialType = parseType(SECRET_MUSIC_URL);
  if(initialType==='youtube') loadYouTube(SECRET_MUSIC_URL);
  else loadDirect(SECRET_MUSIC_URL);

  // İlk kullanıcı etkileşiminde çalmayı dene (mobil için şart)
  function onFirstInteract(){
    if(userInteracted) return;
    userInteracted = true;
    tryPlay();
    // Sonraki tıklamaları da dinle ki autoplay blok kalkarsa tekrar denesin
  }
  ['click','touchstart','keydown'].forEach(ev=>{
    document.addEventListener(ev, onFirstInteract, {once:true, passive:true});
  });

  // Buton toggle
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    userInteracted = true;
    if(isPlaying) tryPause();
    else tryPlay();
  });

  // Sayfa görünür olunca tekrar dene
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible' && !isPlaying && userInteracted){
      tryPlay();
    }
  });

  // Audio eventleri
  audio.addEventListener('playing', ()=>setPlayingUI(true));
  audio.addEventListener('pause', ()=>setPlayingUI(false));
  audio.addEventListener('error', (e)=>{
    console.error('Müzik yüklenemedi, linki kontrol et. CORS olabilir.', e);
  });

  console.log('Gizli müzik sistemi hazır. URL:', SECRET_MUSIC_URL ? 'ayarlı' : 'BOŞ - lütfen SECRET_MUSIC_URL yi doldur');
})();
</script>

<!-- ===== KALP BALON - 20 KAT AZALTILDI + ORTADAN GEÇMEZ ===== -->
<style>
@keyframes __floatUpSide {
  0% { transform: translateY(0) translateX(0) rotate(0deg) scale(0.8); opacity:0; }
  10% { opacity:0.85; }
  85% { opacity:0.75; }
  100% { transform: translateY(-115vh) translateX(var(--drift)) rotate(360deg) scale(1.1); opacity:0; }
}
.__floatItemSide {
  position:absolute;
  bottom:-40px;
  will-change:transform;
  pointer-events:none;
  animation-name: __floatUpSide;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}
</style>
<script>
(function(){
  function getFloatingContainer(){
    let c = document.getElementById('floating-container');
    if(!c){
      c = document.createElement('div');
      c.id = 'floating-container-side';
      c.style.cssText = 'pointer-events:none;position:fixed;inset:0;z-index:2;overflow:hidden;';
      document.body.appendChild(c);
    }
    return c;
  }

  const emojisSide = ["💗","💖","💕","🌸","💫","💘","🎈","❤️","💜","✨","🌹","💐"];

  function spawnOneSide(container){
    const el = document.createElement('div');
    el.className = '__floatItemSide';
    // ORTADAN GEÇMESİN - sadece kenarlar: 0-28% sol, 72-100% sağ
    const isLeft = Math.random() < 0.5;
    const left = isLeft ? (Math.random()*26) : (72 + Math.random()*26);
    const size = 11 + Math.random()*18; // 11-29px - biraz daha zarif
    const duration = 5 + Math.random()*6; // 5-11 saniye yavaş
    // Drift: ortaya doğru kaymasın, dışa doğru kaysın
    const driftVal = isLeft ? (-20 - Math.random()*60) : (20 + Math.random()*60);
    const drift = driftVal + 'px';
    const delay = Math.random()*0.8;
    const emoji = emojisSide[Math.floor(Math.random()*emojisSide.length)];
    const opacity = 0.35 + Math.random()*0.45;

    el.textContent = emoji;
    el.style.left = left + '%';
    el.style.fontSize = size + 'px';
    el.style.setProperty('--drift', drift);
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = delay + 's';
    el.style.opacity = opacity;

    container.appendChild(el);
    setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); }, (duration+delay+1)*1000);
  }

  function spawnBurstSide(container, count){
    for(let i=0;i<count;i++){
      setTimeout(()=>spawnOneSide(container), i*80);
    }
  }

  function initSide(){
    const container = getFloatingContainer();
    // 50 katı 20 kat azalttık: önceden 12/120ms = 100/sn idi, şimdi 2/400ms = 5/sn
    // Bu orijinalin yaklaşık 2.5 katı - gözü yormaz, metinleri kapatmaz
    setInterval(()=>{
      spawnBurstSide(container, 2);
    }, 450);

    // Her 3 saniyede bir 4'lü minik patlama
    setInterval(()=>{
      spawnBurstSide(container, 4);
    }, 3000);

    // Tıklayınca kenarlardan 3 tane
    document.addEventListener('click', function(e){
      if(e.target.closest('#__musicBtn')) return;
      spawnBurstSide(container, 3);
    });

    console.log('Kenardan kalp sistemi: 20 kat azaltıldı, ortadan geçmiyor');
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', initSide);
  }else{
    setTimeout(initSide, 1200);
  }
  setTimeout(initSide, 3500);
})();
</script>
